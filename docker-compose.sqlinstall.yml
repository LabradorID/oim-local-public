services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oim10-mssql
    hostname: mssql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-LocalPassword123}
      - MSSQL_PID=Developer
      - MSSQL_COLLATION=Latin1_General_CI_AS
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    networks:
      - oim-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  dbagent:
    image: oneidentity/oneim-dbagent:latest
    container_name: oim-dbagent
    environment:
      - CONNSTRING=Data Source=mssql;Initial Catalog=OneIM;User ID=sa;Password=${MSSQL_SA_PASSWORD:-LocalPassword123};TrustServerCertificate=True
      - CONSOLE_LOGLEVEL=Info
    networks:
      - oim-network
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
    driver: local

networks:
  oim-network:
    driver: bridge
